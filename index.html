<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meet Local Singles</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(236, 72, 153, 0.6), 0 0 30px rgba(168, 85, 247, 0.4); }
      50% { box-shadow: 0 0 25px rgba(236, 72, 153, 0.9), 0 0 45px rgba(168, 85, 247, 0.7); }
    }
    .btn-gradient {
      background: linear-gradient(135deg, #f97316 0%, #ec4899 50%, #8b5cf6 100%);
      animation: pulseGlow 2.5s infinite ease-in-out;
    }
    .btn-gradient:hover {
      transform: scale(1.03);
      filter: brightness(1.1);
    }
    .bg-slide {
      transition: opacity 1s ease-in-out;
    }
    .glass-card {
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body class="bg-black text-white font-sans h-screen w-screen overflow-hidden select-none relative">

  <!-- OFFER CONFIGURATION -->
  <script>
    const OFFER_URL = "https://u2udt.bemobtrcks.com/click";

    function handleRedirect() {
      // Haptic feedback for mobile devices
      if (navigator.vibrate) {
        navigator.vibrate(50);
      }
      // Instant 1-step redirect to the offer link
      window.location.href = OFFER_URL;
    }
  </script>

  <!-- Background Image Carousel -->
  <div id="carousel-container" class="absolute inset-0 w-full h-full z-0 overflow-hidden">
    <div class="bg-slide absolute inset-0 w-full h-full bg-cover bg-center opacity-100 scale-105 transition-transform duration-10000" style="background-image: url('https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=1200&q=80');"></div>
    <div class="bg-slide absolute inset-0 w-full h-full bg-cover bg-center opacity-0 scale-105 transition-transform duration-10000" style="background-image: url('https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=1200&q=80');"></div>
    <div class="bg-slide absolute inset-0 w-full h-full bg-cover bg-center opacity-0 scale-105 transition-transform duration-10000" style="background-image: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1200&q=80');"></div>
    
    <!-- Dark Vignette Overlay -->
    <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-black/20 to-black/80"></div>
  </div>

  <!-- Top Location Bar -->
  <div class="absolute top-4 left-0 right-0 z-20 flex justify-center px-4">
    <div class="glass-card px-4 py-1.5 rounded-full flex items-center space-x-2 text-xs font-medium tracking-wide text-white/90 shadow-lg">
      <span class="relative flex h-2.5 w-2.5">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
      </span>
      <span>148 Active Matches Near <span id="user-city" class="text-pink-400 font-bold">Your Area</span></span>
    </div>
  </div>

  <!-- Carousel Navigation Arrows -->
  <button onclick="prevSlide()" class="absolute left-3 top-1/2 -translate-y-1/2 z-20 w-11 h-11 rounded-full bg-white/20 hover:bg-white/30 backdrop-blur-md flex items-center justify-center transition-all duration-200 active:scale-90">
    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
  </button>

  <button onclick="nextSlide()" class="absolute right-3 top-1/2 -translate-y-1/2 z-20 w-11 h-11 rounded-full bg-white/20 hover:bg-white/30 backdrop-blur-md flex items-center justify-center transition-all duration-200 active:scale-90">
    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
  </button>

  <!-- Central Question Card (Single Step with Updated Hook) -->
  <div class="absolute inset-0 z-30 flex flex-col items-center justify-start pt-28 px-6">
    <div class="w-full max-w-sm flex flex-col items-center text-center space-y-5">
      
      <h1 class="text-xl sm:text-2xl font-bold text-white drop-shadow-md tracking-tight">
        Are you ready to meet new women in your area today?
      </h1>

      <!-- Direct 1-Click Buttons -->
      <div class="flex items-center space-x-4 w-full max-w-xs">
        <button onclick="handleRedirect()" class="w-1/2 py-3 rounded-full bg-white text-gray-900 font-bold text-base transition-all duration-200 shadow-lg active:scale-95 hover:bg-gray-100">
          No
        </button>
        
        <button onclick="handleRedirect()" class="w-1/2 py-3 rounded-full btn-gradient text-white font-bold text-base transition-all duration-200 shadow-xl active:scale-95">
          Yes
        </button>
      </div>

    </div>
  </div>

  <!-- Carousel Slide Indicators -->
  <div class="absolute bottom-6 left-0 right-0 z-20 flex justify-center space-x-2">
    <div class="dot w-2 h-2 rounded-full bg-white transition-all duration-300"></div>
    <div class="dot w-2 h-2 rounded-full bg-white/40 transition-all duration-300"></div>
    <div class="dot w-2 h-2 rounded-full bg-white/40 transition-all duration-300"></div>
  </div>

  <script>
    // Geo-Location Detection
    async function initGeo() {
      try {
        const res = await fetch('https://ipapi.co/json/');
        if (res.ok) {
          const data = await res.json();
          if (data.city) {
            document.getElementById('user-city').textContent = data.city;
          }
        }
      } catch (e) {
        console.log("Geo lookup skipped");
      }
    }
    initGeo();

    // Carousel Logic
    const slides = document.querySelectorAll('.bg-slide');
    const dots = document.querySelectorAll('.dot');
    let currentSlide = 0;

    function showSlide(index) {
      slides.forEach((slide, i) => {
        slide.style.opacity = i === index ? '1' : '0';
      });
      dots.forEach((dot, i) => {
        dot.className = `dot rounded-full transition-all duration-300 ${i === index ? 'w-5 bg-pink-500' : 'w-2 bg-white/40'}`;
      });
      currentSlide = index;
    }

    function nextSlide() {
      showSlide((currentSlide + 1) % slides.length);
    }

    function prevSlide() {
      showSlide((currentSlide - 1 + slides.length) % slides.length);
    }

    // Auto-advance background every 4 seconds
    setInterval(nextSlide, 4000);
  </script>

</body>
</html>
